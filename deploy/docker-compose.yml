# Local and CI stack. Grows each step: Keycloak + mock API (Step 2), gateway + Prometheus + Grafana (Steps 3-4).
# Run from repo root:  make up    (same as: docker compose -f deploy/docker-compose.yml up -d --build --wait)
name: crewgate

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm", "--http-port=8080", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-dev-only-admin}
      # Tokens always say iss=http://localhost:8080/..., whichever hostname was used to reach
      # Keycloak. Containers can still fetch keys from http://keycloak:8080 (backchannel).
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image has no curl, so ask the management port with bash's /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  mock-roster:
    build:
      context: ..
      dockerfile: services/mock_roster_api/Dockerfile
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "8001:8001"
    environment:
      MOCKAPI_AUTH_MODE: oidc
      MOCKAPI_OIDC_ISSUER: http://localhost:8080/realms/crewgate
      MOCKAPI_OIDC_JWKS_URL: http://keycloak:8080/realms/crewgate/protocol/openid-connect/certs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
