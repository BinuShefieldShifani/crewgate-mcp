# Local and CI stack. Grows each day: Keycloak (Day 2), gateway + Prometheus + Grafana (Day 3-4).
# Run from repo root:  docker compose -f deploy/docker-compose.yml up -d --build
name: crewgate

services:
  mock-roster:
    build:
      context: ..
      dockerfile: services/mock_roster_api/Dockerfile
    ports:
      - "8001:8001"
    environment:
      MOCKAPI_JWT_SIGNING_KEY: ${MOCKAPI_JWT_SIGNING_KEY:-dev-only-signing-key-change-me-0123456789}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
