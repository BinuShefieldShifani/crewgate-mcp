# Scrapes the gateway and the console inside the compose network. Neither /metrics is public:
# the edge (deploy/edge/Caddyfile) answers 404 for it.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8000"]
  - job_name: web
    static_configs:
      - targets: ["web:8090"]
