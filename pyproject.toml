[project]
name = "crewgate-mcp"
version = "0.2.0"
description = "Shared secure MCP core with domain plugins (airline crew roster, flight booking)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.21",
    "mcp>=2.3,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=3.8",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crewgate", "services/mock_roster_api"]

[tool.hatch.build.targets.wheel.sources]
"src/crewgate" = "crewgate"
"services/mock_roster_api" = "mock_roster_api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: needs docker compose services (Keycloak, mock APIs)",
    "sandbox: calls the real Duffel test-mode API, needs DUFFEL_TEST_TOKEN",
]
addopts = "-m 'not integration and not sandbox'"

[tool.coverage.run]
source = ["crewgate", "mock_roster_api"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM"]
ignore = ["S105", "S106"]  # dev-only default secrets are flagged by gitleaks config instead

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["crewgate", "mock_roster_api"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "services"]
mypy_path = "src:services"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.bandit]
exclude_dirs = ["tests"]
