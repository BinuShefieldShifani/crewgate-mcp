name: integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  keycloak:
    name: Integration (Keycloak + mock API)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Empty for forks and Dependabot: the booking demo then skips, everything else still runs.
      DUFFEL_ACCESS_TOKEN: ${{ secrets.DUFFEL_TEST_TOKEN }}
      AGENT_LLM_API_KEY: ${{ secrets.GROQ_API_KEY }}  # empty for forks: the agent demo skips
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - name: Start the stack (Keycloak, mock API, gateway, console, Prometheus, Grafana)
        run: docker compose -f deploy/docker-compose.yml up -d --build --wait --wait-timeout 240
      - name: Integration tests
        run: uv run pytest -m integration tests/integration -v --junitxml=integration.xml
      - name: Demo, Step 2 (same as make demo)
        run: uv run python scripts/demo_obo.py
      - name: Demo, Step 3 (same as make demo-guard)
        run: uv run python scripts/demo_guard.py
      - name: Audit chain check (same as make audit-verify)
        run: uv run python scripts/verify_audit.py var/audit.jsonl
      - name: Demo, Step 4 (same as make demo-mcp)
        run: uv run python scripts/demo_mcp.py
      - name: Demo, Step 5 (same as make demo-booking, real Duffel sandbox)
        if: env.DUFFEL_ACCESS_TOKEN != ''
        run: uv run python scripts/demo_booking.py
      - name: Demo, Step 6 (the agent on the real stack, real Keycloak sign-in, Groq)
        # About two model calls. Never fails the check: a busy free tier is not a code problem.
        if: env.AGENT_LLM_API_KEY != ''
        continue-on-error: true
        run: uv run python scripts/agent_chat.py --once "Who could cover a captain at Gothenburg on 2026-12-05?"
      - name: Demo, Step 7 (the web console, signed in like a browser)
        run: uv run python scripts/demo_web.py
      - name: Prometheus scrapes the gateway and the console
        run: |
          for i in $(seq 1 12); do
            up=$(curl -s 'http://localhost:9090/api/v1/query?query=up' | python3 -c "import sys,json; r=json.load(sys.stdin)['data']['result']; print(sum(1 for x in r if x['value'][1]=='1'))")
            [ "$up" = "2" ] && { echo "both targets up"; exit 0; }
            sleep 5
          done
          echo "Prometheus targets not up" >&2; exit 1
      - name: Grafana has the dashboard
        run: curl -sf http://localhost:3000/api/dashboards/uid/crewgate | python3 -c "import sys,json; print(json.load(sys.stdin)['dashboard']['title'])"
      - name: Gateway audit chain (the gateway's own file, inside its container)
        run: |
          docker compose -f deploy/docker-compose.yml cp gateway:/app/var/audit.jsonl var/gateway-audit.jsonl
          uv run python scripts/verify_audit.py var/gateway-audit.jsonl
      - name: Stack logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  edge:
    # The public layout: one URL, Caddy in front, Keycloak under /auth. Same files a Codespace
    # or a server uses, with http://localhost:8443 standing in for the public URL.
    name: Public edge (Caddy, one URL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CREWGATE_PUBLIC_URL: http://localhost:8443
      CREWGATE_PUBLIC_HOST: localhost
      AGENT_LLM_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - name: Start the stack behind the edge
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.public.yml up -d --build --wait --wait-timeout 300
      - name: Only the edge is published
        run: |
          for port in 8000 8001 8080 8090 9090 3000; do
            if curl -s -o /dev/null --max-time 3 "http://localhost:$port/"; then echo "port $port is open" >&2; exit 1; fi
          done
          echo "only 8443 answers"
      - name: Console sign-in, chat and blocked paths through the edge
        run: uv run python scripts/demo_web.py --base http://localhost:8443 --edge
      - name: Dashboards through the edge
        run: curl -sf http://localhost:8443/grafana/api/health
      - name: Stack logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.public.yml logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.public.yml down -v

  server:
    # The always-on server's layout: TLS on 443, Keycloak in production mode, secrets from
    # deploy/.env made by the same script the server uses. Caddy issues a local certificate for
    # "localhost", so the client below skips certificate checks; a real domain gets Let's Encrypt.
    name: Server layout (TLS, production Keycloak)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CREWGATE_IMAGE_TAG: ci
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - name: "deploy/.env from the server script (no keys, so chat and booking stay off)"
        run: printf '\n\n' | bash scripts/server/make_env.sh localhost
      - name: Start the server stack
        run: |
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.public.yml \
            -f deploy/docker-compose.server.yml up -d --build --wait --wait-timeout 360
      - name: HTTPS, redirects, and the console through it
        run: |
          curl -fsSk https://localhost/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)" = "308"
          uv run python scripts/demo_web.py --base https://localhost --edge --insecure
      - name: No dev-only secret is in use
        run: |
          if docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.public.yml \
               -f deploy/docker-compose.server.yml config | grep -q 'dev-only-'; then
            echo "a dev-only secret is still configured" >&2; exit 1
          fi
          echo "all secrets come from deploy/.env"
      - name: Stack logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.public.yml -f deploy/docker-compose.server.yml logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.public.yml -f deploy/docker-compose.server.yml down -v
