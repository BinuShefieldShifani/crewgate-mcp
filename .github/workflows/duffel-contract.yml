name: duffel-contract

# Runs tests/contract against Duffel's real test-mode API with the DUFFEL_TEST_TOKEN secret.
# Not a required check: forks and Dependabot PRs get no secrets, so the job skips itself there.

on:
  schedule:
    - cron: "41 4 * * *"  # nightly: catches Duffel API changes before a demo does
  workflow_dispatch:
  pull_request:
    paths:
      - "src/crewgate/plugins/booking/**"
      - "src/crewgate/core/partner_http.py"
      - "tests/contract/**"
      - ".github/workflows/duffel-contract.yml"

permissions:
  contents: read

concurrency:
  group: duffel-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sandbox:
    name: Duffel sandbox contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DUFFEL_ACCESS_TOKEN: ${{ secrets.DUFFEL_TEST_TOKEN }}
    steps:
      - name: Skip without a token
        if: env.DUFFEL_ACCESS_TOKEN == ''
        run: echo "::notice::DUFFEL_TEST_TOKEN is not available to this run (fork or Dependabot); skipping."
      - uses: actions/checkout@v7
        if: env.DUFFEL_ACCESS_TOKEN != ''
      - uses: astral-sh/setup-uv@v7
        if: env.DUFFEL_ACCESS_TOKEN != ''
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Refuse anything but a test-mode token
        if: env.DUFFEL_ACCESS_TOKEN != ''
        run: |
          case "$DUFFEL_ACCESS_TOKEN" in duffel_test_*) echo "test-mode token" ;; *) echo "::error::not a duffel_test_ token"; exit 1 ;; esac
      - if: env.DUFFEL_ACCESS_TOKEN != ''
        run: uv sync --frozen
      - name: Contract tests
        if: env.DUFFEL_ACCESS_TOKEN != ''
        run: uv run pytest -m sandbox tests/contract -v -s --junitxml=contract.xml
