name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint-type:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-extras
      - run: uv run pytest --cov --cov-report=xml --cov-report=term --junitxml=junit.xml
      - name: Coverage summary
        if: always()
        run: |
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            coverage.xml
            junit.xml

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-extras
      - name: Bandit (medium and above)
        run: uv run bandit -ll -c pyproject.toml -r src services
      - name: Dependency audit
        run: |
          uv export --frozen --no-dev --all-extras --no-hashes --no-emit-project --format requirements-txt > requirements.txt
          uv run pip-audit -r requirements.txt --progress-spinner off
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  evals:
    name: Offline evals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-extras
      # Guard corpus, 22 attacks, 11 Duffel quirks, gateway overhead. No model, so it runs on every
      # PR and fails the build if any safety number moves. Writes the tables to the job summary.
      - run: uv run python -m evals.run offline
      - name: Load test (one process; throughput floor and latency at 1, 8, 32 concurrent)
        run: uv run python -m evals.run load
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-evals
          path: evals/out/

  docker:
    name: Build and scan images
    runs-on: ubuntu-latest
    needs: [lint-type, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -f services/mock_roster_api/Dockerfile -t crewgate/mock-roster:${{ github.sha }} .
          docker build -f deploy/gateway/Dockerfile -t crewgate/gateway:${{ github.sha }} .
          docker build -f deploy/web/Dockerfile -t crewgate/web:${{ github.sha }} .
      - name: Smoke test containers
        run: |
          docker run -d --name roster -p 8001:8001 crewgate/mock-roster:${{ github.sha }}
          docker run -d --name gateway -p 8000:8000 crewgate/gateway:${{ github.sha }}
          for i in $(seq 1 30); do curl -fs http://localhost:8001/health && curl -fs http://localhost:8000/healthz && break; sleep 1; done
          curl -fs http://localhost:8001/health | grep ok
          curl -fs http://localhost:8000/healthz | grep ok
          # the gateway must refuse an anonymous MCP call and point at its metadata
          curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8000/mcp | grep 401
          curl -fs http://localhost:8000/.well-known/oauth-protected-resource/mcp | grep authorization_servers
          # the console starts without a model key, with chat switched off
          docker run -d --name web -p 8090:8090 crewgate/web:${{ github.sha }}
          for i in $(seq 1 30); do curl -fs http://localhost:8090/healthz && break; sleep 1; done
          curl -fs http://localhost:8090/api/session | grep '"chat_enabled":false'
          curl -fsI http://localhost:8090/ | grep -i "content-security-policy"
      # Not using aquasecurity/trivy-action: its version tags were force-pushed to malware in
      # March 2026 (GHSA-69fq-xp46-6x23). We run a pinned Trivy image that Aqua lists as clean.
      # The vulnerability DB is downloaded ONCE per run (not once per image), from three
      # registries in turn with backoff, and cached between runs. A mirror answering 429 then
      # costs a retry, not a red build. If every registry fails, the scan uses the cached DB
      # and says so in the summary; with no cached DB at all, the job fails.
      - name: Restore Trivy DB cache
        uses: actions/cache@v4
        with:
          path: .trivy-cache
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ runner.os }}-
      - name: Download Trivy DB
        id: trivydb
        run: |
          mkdir -p .trivy-cache
          trivy() { docker run --rm -v "$PWD/.trivy-cache:/root/.cache/trivy" ghcr.io/aquasecurity/trivy:0.69.2 "$@"; }
          for attempt in 1 2 3; do
            for repo in mirror.gcr.io/aquasec/trivy-db:2 public.ecr.aws/aquasecurity/trivy-db:2 ghcr.io/aquasecurity/trivy-db:2; do
              if trivy image --download-db-only --db-repository "$repo" --no-progress; then
                echo "db=fresh" >> "$GITHUB_OUTPUT"; echo "DB from $repo"; exit 0
              fi
              echo "::warning::Trivy DB download from $repo failed (attempt $attempt)"
            done
            sleep $((attempt * 30))
          done
          if [ -f .trivy-cache/db/trivy.db ]; then
            echo "db=cached" >> "$GITHUB_OUTPUT"
            echo "::warning::All Trivy DB registries failed; scanning with the cached DB"
          else
            echo "::error::No Trivy DB could be downloaded and none is cached"; exit 1
          fi
      - name: Trivy image scan
        run: |
          : > trivy.txt
          if [ "${{ steps.trivydb.outputs.db }}" = "cached" ]; then
            echo "NOTE: every DB registry failed, this scan used the cached DB" | tee -a trivy.txt
          fi
          for image in mock-roster gateway web; do
            echo "== crewgate/$image" | tee -a trivy.txt
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/.trivy-cache:/root/.cache/trivy" \
              ghcr.io/aquasecurity/trivy:0.69.2 image --skip-db-update \
              --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed --no-progress \
              --format table --exit-code 1 "crewgate/$image:${{ github.sha }}" | tee -a trivy.txt
          done
      - name: Scan summary
        if: always()
        run: |
          echo "### Image scan (CRITICAL, HIGH, fixable)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat trivy.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no report" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
