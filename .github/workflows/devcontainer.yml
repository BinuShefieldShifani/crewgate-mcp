name: devcontainer

# Builds the Codespaces / dev container exactly as GitHub would, whenever its config changes.
# Added after a stale base image (devcontainers/python major 1) broke Codespaces: its Yarn apt
# source had an unverifiable key, so every feature install failed and Codespaces fell back to
# recovery mode. Stay on the image's current major version ("3-"), as its maintainers advise.

on:
  pull_request:
    paths: [".devcontainer/**", ".github/workflows/devcontainer.yml"]
  push:
    branches: [main]
    paths: [".devcontainer/**", ".github/workflows/devcontainer.yml"]
  schedule:
    - cron: "17 5 * * 1"  # weekly: catches base-image breakage before you open a codespace
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build dev container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build with the Dev Containers CLI
        run: npx --yes @devcontainers/cli@0.83 build --workspace-folder . --log-level info
      - name: Tools the project needs are present
        run: |
          npx --yes @devcontainers/cli@0.83 up --workspace-folder . --skip-post-create
          npx --yes @devcontainers/cli@0.83 exec --workspace-folder . bash -lc \
            'python --version && pipx --version && node --version && npx --version && docker --version && gh --version | head -1'
