name: models-probe

# One-off diagnosis: which request shape does GitHub Models answer with real JSON?
# Seven small requests (7 of the day's ~150 calls). Prints status, content type and the first
# 300 characters of each answer. Never prints the token.

on:
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      URL: https://models.github.ai/inference/chat/completions
      MINIMAL: '{"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"Say hi"}]}'
      FULL: >-
        {"model":"openai/gpt-4o-mini","temperature":0,"seed":7,"tool_choice":"auto",
        "messages":[{"role":"user","content":"What time is it in Gothenburg? Use the tool."}],
        "tools":[{"type":"function","function":{"name":"get_time","description":"Get the time in a city.",
        "parameters":{"type":"object","properties":{"city":{"type":"string"}},"required":["city"]}}}]}
    steps:
      - name: Environment
        run: |
          env | grep -i -E '^(https?_proxy|no_proxy|all_proxy)=' | cut -d= -f1 || echo "no proxy variables set"
          curl --version | head -1
      - name: Probe
        run: |
          probe() {
            label="$1"; shift
            echo "== $label"
            code=$(curl -sS -o body.txt -D headers.txt -w '%{http_code}' "$@" || true)
            echo "status: $code"
            grep -i -E '^(content-type|content-encoding|x-ratelimit-remaining-requests|location):' headers.txt || true
            head -c 300 body.txt; echo; echo
          }
          AUTH="Authorization: Bearer $GITHUB_TOKEN"
          probe "1. docs example (Accept vnd.github+json, API version)" -X POST "$URL" \
            -H "Accept: application/vnd.github+json" -H "$AUTH" -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" -d "$MINIMAL"
          probe "2. quickstart example (no Accept)" -X POST "$URL" -H "$AUTH" -H "Content-Type: application/json" -d "$MINIMAL"
          probe "3. docs headers, follow redirects (-L)" -L -X POST "$URL" \
            -H "Accept: application/vnd.github+json" -H "$AUTH" -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" -d "$MINIMAL"
          probe "4. our body (tools, seed, temperature), docs headers" -X POST "$URL" \
            -H "Accept: application/vnd.github+json" -H "$AUTH" -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" -d "$FULL"
          probe "5. our headers (Accept application/json, gzip)" -X POST "$URL" \
            -H "Accept: application/json" -H "Accept-Encoding: gzip" --compressed -H "$AUTH" \
            -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/json" -d "$FULL"
          probe "6. python-httpx user agent" -X POST "$URL" -A "python-httpx/0.28.1" \
            -H "Accept: application/json" -H "$AUTH" -H "Content-Type: application/json" -d "$MINIMAL"
          probe "7. older endpoint models.inference.ai.azure.com" -X POST \
            "https://models.inference.ai.azure.com/chat/completions" -H "$AUTH" -H "Content-Type: application/json" \
            -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"Say hi"}]}'
