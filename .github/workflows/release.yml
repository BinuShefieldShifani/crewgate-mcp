name: release

# A tag like v1.0.0 builds the three images for amd64 and arm64, pushes them to GHCR with an
# SBOM and build provenance attached, signs them with Sigstore (keyless, tied to this workflow),
# creates a GitHub release, and deploys that tag to the server.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Deploying needs repo secrets DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS and
# the repo variable CREWGATE_DOMAIN (docs/deploy.md). Without them the release still happens;
# only the deploy job skips.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to (re)deploy, e.g. v1.0.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  images:
    name: Build, push, sign (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write  # keyless signing: Sigstore checks this workflow's OIDC identity
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: gateway, dockerfile: deploy/gateway/Dockerfile }
          - { name: web, dockerfile: deploy/web/Dockerfile }
          - { name: mock-roster, dockerfile: services/mock_roster_api/Dockerfile }
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
      - name: Image name (GHCR needs lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/crewgate-${{ matrix.name }}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3 (no floating v4 tag exists)
      - name: Sign by digest
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Summary
        run: |
          {
            echo "### ${IMAGE}:${TAG}"
            echo "digest \`${{ steps.build.outputs.digest }}\`, platforms amd64 + arm64, SBOM and provenance attached, signed"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: GitHub release
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}
      - name: Create the release (skipped if it exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 && { echo "release $TAG exists"; exit 0; }
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          cat > notes.md <<NOTES
          Images (amd64 + arm64), each with an SBOM and SLSA provenance, signed with Sigstore:

          - \`ghcr.io/${owner}/crewgate-gateway:${TAG}\`
          - \`ghcr.io/${owner}/crewgate-web:${TAG}\`
          - \`ghcr.io/${owner}/crewgate-mock-roster:${TAG}\`

          Verify a signature:

          \`\`\`
          cosign verify ghcr.io/${owner}/crewgate-gateway:${TAG} \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \\
            --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/'
          \`\`\`

          Read the SBOM: \`docker buildx imagetools inspect ghcr.io/${owner}/crewgate-gateway:${TAG} --format '{{ json .SBOM }}'\`
          NOTES
          gh release create "$TAG" --title "crewgate $TAG" --notes-file notes.md --generate-notes --verify-tag

  deploy:
    name: Deploy to the server
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://${{ vars.CREWGATE_DOMAIN }}/
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DOMAIN: ${{ vars.CREWGATE_DOMAIN }}
    steps:
      - name: Skip without a server
        if: env.DEPLOY_HOST == '' || env.DOMAIN == ''
        run: echo "::notice::No DEPLOY_HOST secret or CREWGATE_DOMAIN variable; release done, deploy skipped."
      - uses: actions/checkout@v6
        if: env.DEPLOY_HOST != '' && env.DOMAIN != ''
        with:
          ref: ${{ env.TAG }}
      - name: SSH key
        if: env.DEPLOY_HOST != '' && env.DOMAIN != ''
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts  # pinned host key: no trust on first use
      - name: Deploy over SSH
        if: env.DEPLOY_HOST != '' && env.DOMAIN != ''
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes "${DEPLOY_USER:-ubuntu}@${DEPLOY_HOST}" \
            "cd /opt/crewgate && git fetch --quiet --tags --force origin && git checkout --quiet --detach '$TAG' && bash scripts/server/deploy.sh '$TAG'"
      - uses: astral-sh/setup-uv@v6
        if: env.DEPLOY_HOST != '' && env.DOMAIN != ''
        with:
          python-version: "3.12"
      - name: Smoke test the live site
        if: env.DEPLOY_HOST != '' && env.DOMAIN != ''
        run: |
          uv sync --frozen --all-extras
          curl -fsS "https://${DOMAIN}/healthz"
          uv run python scripts/demo_web.py --base "https://${DOMAIN}" --edge
